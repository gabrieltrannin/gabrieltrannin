<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff9b7a">
  <meta name="description" content="Fuzuê: party game 3D para jogar online com os amigos, direto no navegador.">
  <title>Fuzuê</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
</head>
<body>
  <canvas id="scene" aria-label="Arena do jogo"></canvas>
  <div id="fx" class="fx"></div>

  <!-- Tela inicial -->
  <main id="menu" class="menu" hidden>
    <section class="menu-card card">
      <h1 class="logo" aria-label="Fuzuê"><span style="--c:#ffc93c;--r:-5deg">F</span><span style="--c:#ff5fa2;--r:4deg">u</span><span style="--c:#3fd6b0;--r:-3deg">z</span><span style="--c:#4aa3ff;--r:5deg">u</span><span style="--c:#ff8a3d;--r:-4deg">ê</span></h1>
      <h2 id="menuTitle" class="menu-title">Jogar com os amigos</h2>

      <form id="menuForm" class="menu-form" novalidate>
        <label class="lbl" for="nameInput">Seu apelido</label>
        <input id="nameInput" class="field" maxlength="16" autocomplete="nickname" placeholder="Como te chamam?" enterkeyhint="go">
        <fieldset class="chars">
          <legend class="lbl">Personagem</legend>
          <div id="charGrid" class="char-grid"></div>
        </fieldset>
        <button id="primaryBtn" class="btn big" type="submit">Criar sala</button>
      </form>

      <div id="joinRow" class="join-row">
        <span class="or">Tem um código?</span>
        <form id="codeForm" class="code-form" novalidate>
          <input id="codeInput" class="field code-field" maxlength="5" placeholder="K7QX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código da sala">
          <button class="btn" type="submit">Entrar</button>
        </form>
      </div>
      <a id="newRoomLink" class="link" href="/" hidden>Prefiro criar uma sala nova</a>
      <p id="menuError" class="error" role="alert" hidden></p>
    </section>
  </main>

  <!-- Interface durante a partida -->
  <div id="hud" class="hud" hidden>
    <section class="room-card card" aria-label="Sala">
      <div class="room-top">
        <div>
          <span class="eyebrow">Sala</span>
          <div id="roomCode" class="code">----</div>
        </div>
        <button id="copyBtn" class="btn small" type="button">Copiar link</button>
      </div>
      <ul id="playerList" class="plist"></ul>
    </section>

    <button id="leaveBtn" class="btn small ghost leave" type="button">Sair</button>

    <div id="aloneCard" class="alone card" hidden>
      <p><b>Só você por aqui.</b> Mande o link para os amigos. Para testar sozinho, abra o mesmo link em outra janela.</p>
      <div class="alone-row">
        <input id="aloneLink" class="field" readonly aria-label="Link da sala">
        <button id="aloneCopy" class="btn small" type="button">Copiar</button>
      </div>
    </div>

    <p class="keys card kb-only"><span class="key">WASD</span> ou <span class="key">setas</span> andam · <span class="key">Espaço</span> empurra</p>
    <div id="stick" class="stick touch-only" aria-hidden="true"><div id="knob" class="knob"></div></div>
    <button id="pushBtn" class="btn push" type="button">Empurrar</button>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
