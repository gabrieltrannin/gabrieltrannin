[package]
name = "vitral"
version = "0.1.0"
edition = "2024"
description = "Cliente de música leve e pessoal, feito em Rust"
publish = false

[dependencies]
librespot-core = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "accesskit", "clipboard", "links"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
semver = "1"
self-replace = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
