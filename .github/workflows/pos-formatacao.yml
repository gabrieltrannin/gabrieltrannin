name: Pós-formatação (gerar .exe)

on:
  push:
    paths:
      - "pos-formatacao/**"
      - ".github/workflows/pos-formatacao.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pos-formatacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Gerar o .exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name PosFormatacao --add-data "apps.json;." main.py

      - name: Abrir o .exe em modo autoteste
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PosFormatacao.exe -ArgumentList '--autoteste' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'O app não fechou sozinho.' }
          if ($p.ExitCode -ne 0) { throw "O autoteste falhou (código $($p.ExitCode))." }
          Write-Output 'Autoteste ok.'

      - name: Aplicar as otimizações nesta máquina virtual
        run: python tests/verificar_no_windows.py

      - name: Montar o kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force kit/instaladores | Out-Null
          Copy-Item dist/PosFormatacao.exe kit/
          Copy-Item apps.json kit/
          Copy-Item instaladores/LEIA-ME.txt kit/instaladores/

      - uses: actions/upload-artifact@v4
        with:
          name: PosFormatacao
          path: pos-formatacao/kit
          retention-days: 90
