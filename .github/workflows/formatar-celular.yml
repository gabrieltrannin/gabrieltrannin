name: Gerar executável - Formatar Celular

# Roda sempre que o código do programa muda, ou manualmente pela aba Actions.
on:
  push:
    paths:
      - "formatar-celular/**"
      - ".github/workflows/formatar-celular.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: formatar-celular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v

      - name: Instalar o PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Gerar FormatarCelular.exe
        run: python gerar_exe.py

      - name: Conferir se o .exe abre
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FormatarCelular.exe -ArgumentList "--autoteste" -PassThru
          $null = $p.Handle  # guarda o handle para conseguir ler o ExitCode depois
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "O programa travou ao abrir"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "O programa fechou com erro (codigo $($p.ExitCode))"; exit 1 }
          Get-Item dist\FormatarCelular.exe | Format-List Name, Length

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: FormatarCelular-Windows
          path: formatar-celular/dist/FormatarCelular.exe
          if-no-files-found: error
